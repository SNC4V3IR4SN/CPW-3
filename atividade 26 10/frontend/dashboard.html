
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Meu Sistema</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topo">
        <h2>Meu Sistema</h2>
        <a class="botao-sair" href="/logout">Sair</a>
    </header>

    <main class="dashboard">
        <section class="boas-vindas">
            <span class="status">● Acesso autorizado</span>

            <h1>Bem-vindo ao Dashboard!</h1>

            <p>
                Você entrou no sistema com sucesso.
                Sua sessão está ativa.
            </p>
        </section>

        <section class="painel">
            <div class="painel-icone">✓</div>

            <h2>Login realizado</h2>

            <p>
                Seu e-mail foi confirmado e seu acesso foi liberado.
            </p>
        </section>

        <footer>
            Sistema de autenticação por e-mail
        </footer>
    </main>
</body>
</html>
